<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇率转换器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9efed; --card:#ffffff; --ink:#12302b; --muted:#5b6b67;
  --line:#cfdad6; --accent:#e8a317; --accent-ink:#2b1d00; --err:#b3261e;
  --font:"IBM Plex Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a18;--card:#16262a;--ink:#e6f0ed;--muted:#92a6a1;--line:#2b403c;--accent:#f0b43a;--accent-ink:#2b1d00;--err:#ff8a80}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:520px}
h1{font-size:22px;font-weight:600;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#amount{font-family:var(--num);font-size:28px;font-weight:600;padding:10px 12px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-top:16px}
#swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:18px;cursor:pointer;transition:transform .25s}
#swap:hover{border-color:var(--accent)}
#swap.spin{transform:rotate(180deg)}
.result{margin-top:22px;padding:18px;border-radius:10px;background:var(--ink);color:var(--bg)}
.result small{display:block;opacity:.75;font-size:13px}
#out{font-family:var(--num);font-size:40px;font-weight:600;line-height:1.15;margin:4px 0 8px;word-break:break-all}
#rate{font-size:14px;opacity:.9}
.meta{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta button{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
#status.err{color:var(--err)}
h2{font-size:15px;font-weight:600;margin:26px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 4px;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-family:var(--num);font-size:16px;font-weight:500}
td span{color:var(--muted);margin-left:6px;font-size:12.5px}
</style>
</head>
<body>
<main>
  <h1>汇率转换器</h1>
  <div class="card">
    <label for="amount">金额</label>
    <input id="amount" type="number" inputmode="decimal" value="100" min="0" step="any">

    <div class="pair">
      <div><label for="from">从</label><select id="from"></select></div>
      <button id="swap" type="button" aria-label="互换货币">⇄</button>
      <div><label for="to">到</label><select id="to"></select></div>
    </div>

    <div class="result" aria-live="polite">
      <small id="expr">—</small>
      <div id="out">—</div>
      <div id="rate"></div>
    </div>

    <div class="meta">
      <span id="status">正在获取汇率…</span>
      <button id="refresh" type="button">刷新</button>
    </div>
  </div>

  <h2>常用货币对照</h2>
  <div class="card" style="padding:8px 18px"><table id="table"></table></div>
</main>

<script>
(function () {
  var CACHE_KEY = "fx_rates_v1";
  var CACHE_MS = 60 * 60 * 1000; // 缓存 1 小时，减少 API 调用
  var COMMON = ["CNY","USD","EUR","JPY","SGD","HKD","GBP","AUD","KRW","MYR"];
  var rates = null;   // 以 USD 为基准: { CNY: 7.1, ... }
  var updated = "";

  var $ = function (id) { return document.getElementById(id); };
  var names;
  try { names = new Intl.DisplayNames(["zh-CN"], { type: "currency" }); } catch (e) { names = null; }
  function cname(c) { try { return names ? names.of(c) : c; } catch (e) { return c; } }

  // ---- 获取汇率：主 API + 备用 API（均免费、无需 Key、支持跨域）----
  function fetchPrimary() {
    // open.er-api.com：160+ 种货币，每天更新
    return fetch("https://open.er-api.com/v6/latest/USD")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        if (d.result !== "success") throw new Error("API error");
        return { rates: d.rates, time: d.time_last_update_utc };
      });
  }
  function fetchBackup() {
    // fawazahmed0/currency-api（jsDelivr CDN）
    return fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        var out = {};
        Object.keys(d.usd).forEach(function (k) { out[k.toUpperCase()] = d.usd[k]; });
        return { rates: out, time: d.date };
      });
  }

  function load(force) {
    if (!force) {
      try {
        var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (c && Date.now() - c.at < CACHE_MS) { apply(c.rates, c.time, true); return; }
      } catch (e) {}
    }
    setStatus("正在获取汇率…");
    fetchPrimary().catch(fetchBackup).then(function (res) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), rates: res.rates, time: res.time })); } catch (e) {}
      apply(res.rates, res.time, false);
    }).catch(function () {
      try {
        var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (c) { apply(c.rates, c.time, true); setStatus("网络不可用，显示的是缓存汇率（" + fmtTime(c.time) + "）", true); return; }
      } catch (e) {}
      setStatus("获取汇率失败，请检查网络后点“刷新”", true);
    });
  }

  function fmtTime(t) {
    var d = new Date(t);
    return isNaN(d) ? String(t) : d.toLocaleString("zh-CN", { hour12: false });
  }
  function setStatus(msg, isErr) {
    var s = $("status"); s.textContent = msg; s.className = isErr ? "err" : "";
  }

  function apply(r, time, cached) {
    var first = !rates;
    rates = r; updated = time;
    if (first) fillSelects();
    setStatus("汇率更新于 " + fmtTime(time) + (cached ? "（缓存）" : ""));
    render();
  }

  function fillSelects() {
    var codes = Object.keys(rates).sort();
    var top = COMMON.filter(function (c) { return rates[c]; });
    var rest = codes.filter(function (c) { return top.indexOf(c) < 0; });
    function opts(list) {
      return list.map(function (c) { return '<option value="' + c + '">' + c + " · " + cname(c) + "</option>"; }).join("");
    }
    var html = '<optgroup label="常用">' + opts(top) + '</optgroup><optgroup label="其他">' + opts(rest) + "</optgroup>";
    $("from").innerHTML = html; $("to").innerHTML = html;
    $("from").value = "SGD"; $("to").value = "CNY";
  }

  function convert(amount, from, to) { return amount / rates[from] * rates[to]; }
  function fmt(n, max) {
    return n.toLocaleString("zh-CN", { maximumFractionDigits: max == null ? 2 : max });
  }

  function render() {
    if (!rates) return;
    var amt = parseFloat($("amount").value);
    var from = $("from").value, to = $("to").value;
    var unit = convert(1, from, to);
    $("rate").textContent = "1 " + from + " = " + fmt(unit, 6) + " " + to + "　|　1 " + to + " = " + fmt(1 / unit, 6) + " " + from;
    if (isNaN(amt)) { $("expr").textContent = "请输入金额"; $("out").textContent = "—"; $("table").innerHTML = ""; return; }
    $("expr").textContent = fmt(amt, 4) + " " + from + " (" + cname(from) + ") =";
    $("out").textContent = fmt(convert(amt, from, to), 4) + " " + to;
    $("table").innerHTML = COMMON.filter(function (c) { return rates[c] && c !== from; }).map(function (c) {
      return "<tr><td>" + c + "<span>" + cname(c) + "</span></td><td>" + fmt(convert(amt, from, c), 2) + "</td></tr>";
    }).join("");
  }

  $("amount").addEventListener("input", render);
  $("from").addEventListener("change", render);
  $("to").addEventListener("change", render);
  $("refresh").addEventListener("click", function () { load(true); });
  $("swap").addEventListener("click", function () {
    var f = $("from").value; $("from").value = $("to").value; $("to").value = f;
    var b = $("swap"); b.classList.toggle("spin");
    render();
  });

  load(false);
})();
</script>
</body>
</html>
